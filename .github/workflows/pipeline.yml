name: CI/CD Pipeline
on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

env:
    MONGODB_DB_NAME: practice-db
    MONGODB_USERNAME: ${{ secrets.MONGODB_USERNAME }}
    MONGODB_PASSWORD: ${{ secrets.MONGODB_PASSWORD }}
    MONGODB_CLUSTER_ADDRESS: ${{ secrets.MONGODB_CLUSTER_ADDRESS }}
    REGISTRY: ghcr.io
    IMAGE_NAME: ${{github.repository}}

jobs:
    # STAGE 1: Lint & Integration Testing
    test:
        runs-on: ubuntu-latest
        # Define the mongodb service that will be used for the test job
        # When GitHub Actions runs your pipeline, it starts inside a fresh, completely empty virtual machine with no database installed. Without the services: mongodb block, running npm test in CI would instantly crash with a connection error: ECONNREFUSED 127.0.0.1:27017.
        services:
            mongodb:
                image: mongo:6.0
                ports:
                    - 27017:27017
                # Wait for the MongoDB service to be healthy before allowing other steps to run.
                options: >-
                    --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        steps:
            # checkout is an action that downloads the latest version of the GitHub Actions checkout action to your runner
            - name: Checkout code
              uses: actions/checkout@v4
            #checkout@v4 downloads the latest version of the GitHub Actions checkout action to your runner
            - name: Set Node.js Version
              uses: actions/setup-node@v3
              with:
                  node-version: 18
                  cache: "npm" # We set this to cache the node_modules directory so that we don't have to install dependencies every time we run the pipeline
                  cache-dependency-path: ./backend/package-lock.json # This tells the cache action to use the package-lock.json file to determine when to invalidate the cache. If the package-lock.json file changes, the cache will be invalidated and the dependencies will be reinstalled.

            - name: Install dependencies
              run: npm ci # This will install the dependencies for the backend
              working-directory: ./backend

            - name: Run ESLint
              run: npm run lint
              working-directory: ./backend

            - name: Run Integration tests
              run: npm test
              working-directory: ./backend

    # Stage 2: Build & Push Docker image

    build-and-push:
        needs: test
        # This condition ensures the job runs only when code is pushed directly to the main branch (not during a pull request or for other branches).
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        runs-on: ubuntu-latest

        # We need to give the job permissions to read the code and write to the container registry.
        permissions:
            contents: read
            packages: write

        # We define an output variable for this job.
        # This variable will be used by the next job to get the image tag.
        outputs:
            image_tag: ${{ steps.meta.outputs.version}}

        steps:
            - name: Checkout code
              uses: actions/checkout@v3

              # Set up Docker Buildx: This action creates a multi-architecture Docker build environment.
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Login to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  # We use the GITHUB_TOKEN secret to authenticate with GHCR.
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract metadata (tags, labels) and Build & Push image
              id: meta
              uses: docker/metadata-action@v4
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  tags: type=sha, prefix=
                      type=raw,value={{date +%Y%m%d}}
